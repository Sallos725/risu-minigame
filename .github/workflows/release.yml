name: Release

# v로 시작하는 태그(예: v0.1.0)를 push하면 테스트·빌드 후 GitHub Release에 플러그인 파일을 올린다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 태그와 package.json 버전 일치 확인
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::태그(${GITHUB_REF_NAME})와 package.json 버전(${PKG})이 달라요."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: 플러그인 헤더 버전 확인
        run: grep -q "^//@version ${GITHUB_REF_NAME#v}$" dist/risu-minigame.js

      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/risu-minigame.js \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE

      # 플러그인 헤더의 //@update-url이 가리키는 곳. 정식 버전만 올려서 pre-release는 자동 업데이트에 안 잡히게 한다.
      - name: release 브랜치에 플러그인 파일 갱신
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish && cp dist/risu-minigame.js publish/
          cd publish
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risu-minigame.js
          git commit -q -m "release ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release
